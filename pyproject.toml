[project]
name = "aamt-context"
version = "0.1.0"
description = "Context management and shared memory for the aamt multi-agent Scrum team"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Adapters for LangChain chat models / tools and LangGraph's prebuilt agent.
langchain = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
]
# Exact token counts instead of the chars/4 heuristic.
tiktoken = ["tiktoken>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    # the host project, pinned to the commit the integration patch targets
    "aamt @ git+https://github.com/Krishil-Parikh/scrum-master-agent@516a4be53a56ca8952b3ff46f9e124f1de868e6d",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aamt_context"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
