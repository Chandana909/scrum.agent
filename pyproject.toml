[project]
name = "aamt-context"
version = "0.2.0"
description = "Context management and shared memory for the aamt multi-agent Scrum team"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "multi-agent", "memory", "context-engineering", "langgraph", "scrum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Adapters for LangChain chat models / tools and LangGraph's prebuilt agent.
langchain = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
]
# Exact token counts instead of the chars/4 heuristic.
tiktoken = ["tiktoken>=0.7"]

[project.urls]
Repository = "https://github.com/Chandana909/scrum.agent"
"Host project (aamt)" = "https://github.com/Krishil-Parikh/scrum-master-agent"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # pinned so lint and type checks give the same answer locally and in CI
    "ruff==0.16.9",
    "pyright==1.1.414",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    # the host project, pinned to the commit the integration patch targets
    "aamt @ git+https://github.com/Krishil-Parikh/scrum-master-agent@516a4be53a56ca8952b3ff46f9e124f1de868e6d",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aamt_context"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ruff's default set, plus: every broad `except` must log/re-raise or carry a justified noqa
extend-select = ["BLE"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
